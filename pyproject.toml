[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beg"
version = "0.1.0"
description = "Deterministic Behavioral Evidence Graph construction"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "tiktoken>=0.7"]

[project.optional-dependencies]
test = ["jsonschema>=4.20"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "beg",
  "beg.*",
  "evaluation_core",
  "evaluation_core.*",
  "agentloop",
  "agentloop.*",
  "tracereview",
  "tracereview.*",
]
namespaces = false

[tool.unittest]
start-directory = "tests"
