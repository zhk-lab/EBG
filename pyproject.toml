[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebg"
version = "0.1.0"
description = "Deterministic Evidence-Grounded Behavior Graph construction"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20", "tiktoken>=0.7", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8"]
analysis = ["numpy>=1.26", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = [
  "ebg",
  "ebg.*",
  "repograph",
  "repograph.*",
  "evaluation_core",
  "evaluation_core.*",
  "agentloop",
  "agentloop.*",
  "tracereview",
  "tracereview.*",
  "scripts",
  "scripts.*",
]
namespaces = false
